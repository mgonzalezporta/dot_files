######################################################################
### GENERAL
######################################################################

# To make ctrl-arrow, etc. work
# Note: for macOS, need to disable ctrl-arrow mappings in mission control
# (move left/right a space, Mission Control, Application windows)
set-window-option -g xterm-keys on

# Extended keys, so the terminal can send Ctrl-Shift-letter combinations
# (otherwise Ctrl-Shift-s is indistinguishable from Ctrl-s)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Enable mouse clicking
set-option -g mouse on

# Reload configuration
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

######################################################################
### NAVIGATION
######################################################################

# Sessions
bind-key -n C-s new-session
bind s command-prompt 'rename-session %%'
# Ctrl-Shift-s: iTerm reports it as C-S-S; CSI u terminals as C-S-s
bind-key -n C-S-S command-prompt 'rename-session %%'
bind-key -n C-S-s command-prompt 'rename-session %%'
bind k command-prompt 'kill-session -t %%'
#bind-key -n C-q command-prompt 'kill-session -t %%'
#bind-key -n C-s command-prompt 'rename-session %%'
bind-key -n C-f command-prompt -p find-session 'switch-client -t %%'

# Windows (tabs)
bind-key -n C-w new-window
bind w command-prompt 'rename-window %%'
# Ctrl-Shift-w: iTerm reports it as C-S-W; CSI u terminals as C-S-w
bind-key -n C-S-W command-prompt 'rename-window %%'
bind-key -n C-S-w command-prompt 'rename-window %%'
# bind-key -n C-w command-prompt 'rename-window %%'
bind-key -n C-S-Left  select-window -t :-
bind-key -n C-S-Right select-window -t :+
bind-key -r S-Left  swap-window -t -1\; select-window -t -1
bind-key -r S-Right swap-window -t +1\; select-window -t +1

# Splits
# Vim naming: vertical split = side by side, horizontal split = top and bottom
bind-key -n C-j split-window -h -c '#{pane_current_path}'
bind-key -n C-k split-window -v -c '#{pane_current_path}'
bind-key -n C-z resize-pane -Z \; display-message 'zoomed'
bind-key -n C-Left  select-pane -L
bind-key -n C-Right select-pane -R
bind-key -n C-Up    select-pane -U
bind-key -n C-Down  select-pane -D
#bind v split-window -h -c '#{pane_current_path}'
#bind h split-window -v -c '#{pane_current_path}'

# Smart pane switching with awareness of Vim splits
# (left/right only; Ctrl-j/k split panes instead, use Ctrl-Up/Down to move)
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

######################################################################
### UI
######################################################################

# Customise bottom panels
set -g status-left-length 30
set -g status-right '%d-%b-%Y %H:%M (#H)'

# Enable colors
set -g default-terminal 'xterm-256color'
set -ga terminal-overrides ",*256col*:Tc"
